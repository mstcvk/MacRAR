name: macOS build

on:
  push:
    branches: [audit/full-project-review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: sh tests/run.sh

      - name: Fetch 7-Zip (SHA-256 verified)
        run: zsh ./fetch-tools.sh

      - name: Release build
        run: zsh ./build.sh

      - name: Debug-hook build
        run: MACRAR_DEBUG_BUILD=1 zsh ./build.sh

      - name: App Store build
        run: zsh ./build.sh appstore

      - name: Runtime smoke test (debug build)
        env:
          MACRAR_NO_UPDATE_CHECK: "1"
          MACRAR_NO_MOVE_PROMPT: "1"
          MACRAR_DEBUG_PASSWORD: "test"
          MACRAR_SNAPSHOT_DELAY: "8"
        run: |
          set -u
          APP="$GITHUB_WORKSPACE/build/MacRAR.app/Contents/MacOS/MacRAR"
          SEVENZ="$GITHUB_WORKSPACE/tools/7zz"
          FX="$RUNNER_TEMP/fx"
          mkdir -p "$FX/src/dir" "$FX/shots"
          echo "hello" > "$FX/src/hello.txt"
          echo "a" > "$FX/src/dir/a.txt"
          (cd "$FX/src" && "$SEVENZ" a -tzip "$FX/plain.zip" hello.txt dir >/dev/null)
          (cd "$FX/src" && "$SEVENZ" a -tzip -p"test" -mem=AES256 "$FX/enc.zip" hello.txt >/dev/null)
          (cd "$FX/src" && tar -czf "$FX/dot.tar.gz" .)

          run_limited() {
            local secs="$1"; shift
            "$@" & local pid=$!
            ( sleep "$secs"; kill "$pid" 2>/dev/null ) & local watchdog=$!
            wait "$pid"; local rc=$?
            kill "$watchdog" 2>/dev/null || true
            return $rc
          }

          for a in plain.zip enc.zip dot.tar.gz; do
            name="${a%%.*}"
            MACRAR_SNAPSHOT="$FX/shots/$name" run_limited 90 "$APP" "$FX/$a" || echo "app exit $? for $a"
          done
          ls -la "$FX/shots"
          test "$(ls "$FX/shots"/*.png 2>/dev/null | wc -l)" -ge 3 || { echo "SNAPSHOT EKSİK"; exit 1; }

          # Issue #3: boş klasörde "Buraya Çıkart" uyarı vermeden dosyaları çıkarmalı
          mkdir -p "$FX/xt" && cp "$FX/dot.tar.gz" "$FX/xt/"
          run_limited 120 "$APP" --extract-here "$FX/xt/dot.tar.gz" || echo "extract exit $?"
          if test -f "$FX/xt/dir/a.txt"; then echo "EXTRACT OK: dir/a.txt"; else echo "EXTRACT FAILED"; ls -laR "$FX/xt"; exit 1; fi

      - name: Feature checks (create, windows, drag)
        env:
          MACRAR_NO_UPDATE_CHECK: "1"
          MACRAR_NO_MOVE_PROMPT: "1"
          MACRAR_SNAPSHOT_DELAY: "6"
        run: |
          APP="$GITHUB_WORKSPACE/build/MacRAR.app/Contents/MacOS/MacRAR"
          SEVENZ="$GITHUB_WORKSPACE/tools/7zz"
          FX="$RUNNER_TEMP/fx"
          run_limited() {
            local secs="$1"; shift
            "$@" & local pid=$!
            ( sleep "$secs"; kill "$pid" 2>/dev/null ) & local watchdog=$!
            wait "$pid"; local rc=$?
            kill "$watchdog" 2>/dev/null || true
            return $rc
          }

          echo "== Oluşturma: her biçim, ardından 7zz t =="
          for f in 7z zip tar tar.gz tar.xz tar.bz2; do
            rm -rf "$FX/fmt" && mkdir -p "$FX/fmt/in/dir"
            echo hello > "$FX/fmt/in/hello.txt"; echo a > "$FX/fmt/in/dir/a.txt"
            MACRAR_DEBUG_FORMAT="$f" run_limited 60 "$APP" --compress "$FX/fmt/in/hello.txt" "$FX/fmt/in/dir" || true
            arc=$(find "$FX/fmt" -type f ! -name hello.txt ! -name a.txt | head -1)
            if [ -n "$arc" ] && "$SEVENZ" t "$arc" >/dev/null 2>&1; then
              echo "CREATE OK   $f -> $(basename "$arc")"
            else
              echo "CREATE FAIL $f (bulunan: ${arc:-yok})"
            fi
          done

          echo "== Pencereler (snapshot) =="
          MACRAR_DEBUG_PREFS=1 MACRAR_SNAPSHOT="$FX/shots/prefs" run_limited 40 "$APP" || true
          MACRAR_DEBUG_ABOUT=1 MACRAR_SNAPSHOT="$FX/shots/about" run_limited 40 "$APP" || true
          MACRAR_DEBUG_ASSOC=1 MACRAR_SNAPSHOT="$FX/shots/assoc" run_limited 40 "$APP" || true
          ls "$FX/shots"

          echo "== Sürükle-bırak (MACRAR_DEBUG_DRAG) =="
          mkdir -p "$FX/dragdest"
          MACRAR_DEBUG_DRAG="$FX/dragdest" MACRAR_DEBUG_CONFIRM=1 run_limited 60 "$APP" "$FX/plain.zip" || true
          if test -f "$FX/dragdest/hello.txt"; then echo "DRAG OK"; else echo "DRAG FAIL"; ls -la "$FX/dragdest"; fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-screenshots
          path: ${{ runner.temp }}/fx/shots/
          if-no-files-found: warn
